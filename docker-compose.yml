services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kudiai
      POSTGRES_USER: kudiai
      POSTGRES_PASSWORD: change-this-local-password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudiai -d kudiai"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://kudiai:change-this-local-password@db:5432/kudiai
      DJANGO_SECRET_KEY: local-development-only-change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
